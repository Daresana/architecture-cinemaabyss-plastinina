name: API Tests

on:
  push:
    branches: [main, cinema]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/postman/package-lock.json
      - name: Start services
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8080/api/users > /dev/null &&
               curl -fsS http://localhost:8081/api/movies/health > /dev/null &&
               curl -fsS http://localhost:8000/health > /dev/null &&
               docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list | grep -q payment-events; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Install test dependencies
        working-directory: tests/postman
        run: npm ci
      - name: API tests
        working-directory: tests/postman
        run: npm run test:local -- --reporters cli,junit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: tests/postman/reports/
      - name: Container logs
        if: always()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down
